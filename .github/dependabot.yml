# One gomod entry per module: everything under demo/ has its own go.mod, so a
# single entry would leave the demo modules unwatched. All Go updates go into one
# group, so a week brings at most one pull request for them.
#
# To switch this off, delete this file. The CI workflow does not depend on it.

version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /demo/blinker
      - /demo/listener
      - /demo/wirecheck
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
