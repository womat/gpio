# One gomod entry per module: everything under demo/ has its own go.mod, so a
# single entry would leave two modules unwatched. Updates are grouped, because
# these modules move together.
#
# To switch this off, delete this file. The CI workflow does not depend on it.

version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /demo/blinker
      - /demo/listener
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
      everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
