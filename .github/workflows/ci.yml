# Continuous integration for github.com/womat/gpio.
#
# Why this exists: rpi does not build on macOS, which is where this module is
# written, so "go test ./..." on a developer machine cannot cover it. The jobs
# below run on Linux, where rpi builds natively and is therefore checked like
# any other package.
#
# Everything under demo/ is a separate Go module with its own go.mod and a
# replace directive pointing at the repository root, so a root-level "go build
# ./..." ignores the demos entirely. They get their own job.
#
# Actions are pinned to a commit SHA, with the release in a comment: a tag like
# @v7 can be moved to other code, a SHA cannot. dependabot (.github/dependabot.yml)
# proposes updates for them.
#
# setup-go takes the version from go.mod but the newest patch of it (check-latest),
# and the weekly run repeats govulncheck without a change here: an advisory against
# the Go toolchain or a dependency appears between commits, and dependabot does not
# report the toolchain.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref supersedes a run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # Covers the demo modules too - gofmt does not care about module
      # boundaries.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  checks:
    name: fix, lint, vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # Pinned rather than @latest: a new release of either tool would
      # otherwise turn this job red without a change in this repository.
      # dependabot does not see pins in a run step; bump these by hand, and in
      # scripts/check.sh as well.
      - name: install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # The same script a developer runs, so the two cannot drift. --check makes
      # go fix and go mod tidy report a pending diff and exit non-zero instead of
      # writing it. It also runs go vet for every module, so the library job does
      # not.
      - name: scripts/check.sh --check
        run: scripts/check.sh --check

  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # -race because the concurrency in internal/watch is the part worth
      # testing.
      - name: go test
        run: go test -race -cover ./...

  cross:
    name: cross-compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Pi 1 / Zero", goos: linux, goarch: arm, goarm: "6" }
          - { name: "Pi 2/3/4 32-bit", goos: linux, goarch: arm, goarm: "7" }
          - { name: "Pi 3/4/5 64-bit", goos: linux, goarch: arm64 }
          # No linux amd64: the library job builds and tests it.
          - { name: "linux 386", goos: linux, goarch: "386" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # Only Linux targets: rpi depends on the Linux GPIO character device, so
      # the module as a whole cannot be built for Windows or macOS.
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build ./...

  demos:
    name: demo ${{ matrix.demo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [blinker, listener, wirecheck]
    defaults:
      run:
        working-directory: demo/${{ matrix.demo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: demo/${{ matrix.demo }}/go.mod
          check-latest: true
      - name: go vet
        run: go vet ./...
      # The demos drive real GPIO lines and have no tests; building them is
      # what keeps API changes from breaking the module's own examples.
      - name: go build
        run: go build -o /dev/null ./cmd
